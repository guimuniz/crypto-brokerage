[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "crypto-brokerage"
version = "0.1.0"
description = "Crypto brokerage platform shell — clean architecture demo"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",           # async PostgreSQL driver
    "alembic>=1.14.0",

    # Validation / settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # HTTP client (integration gateways)
    "httpx>=0.27.0",

    # Resilience (retry with backoff)
    "tenacity>=9.0.0",

    # Utilities
    "python-multipart>=0.0.12",  # form data support
    "email-validator>=2.2.0",    # required by Pydantic's EmailStr
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "hatchling>=1.25.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
